<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0b12">
  <meta name="description" content="Mystery Universe case file.">
  <title>Case | Mystery Universe</title>
  <link rel="stylesheet" href="./assets/css/style.css">
</head>
<body>
  <div class="bg-grid" aria-hidden="true"></div>
  <header class="site-header">
    <a class="brand" href="./index.html" aria-label="Mystery Universe home">
      <span class="brand-mark">MU</span>
      <span>
        <strong>MYSTERY</strong>
        <small>UNIVERSE</small>
      </span>
    </a>
    <div class="header-actions">
      <label class="search-wrap" for="case-search">

      <a class="header-link" href="./index.html">Archive</a>

  <footer class="site-footer">
    <span>MYSTERY UNIVERSE</span>
    <span>INVESTIGATE RESPONSIBLY. TRUST NO SHORTCUT.</span>
